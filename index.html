<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            canvas: '#111113',
            sidebar: '#161618',
            card: '#1A1A1D',
            cardHover: '#1E1E22',
            pill: '#242428',
            borderSubtle: '#242427',
            borderCard: '#26262A',
            borderPill: '#343439',
            accentBlue: '#3B82F6',
          },
        },
      },
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #111113;
      color: #f4f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    /* Custom subtle dark scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #38383f;
    }

    /* Promo card subtle top-left radial illumination matching reference */
    .promo-card-surface {
      background:
        radial-gradient(120% 90% at 22% 8%, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0.01) 48%, transparent 75%),
        #1b1b1e;
      border: 1px solid #2a2a2f;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    /* Upgrade Now button subtle 3D top bevel */
    .upgrade-btn {
      background: linear-gradient(180deg, #2d2d32 0%, #26262a 100%);
      border: 1px solid #38383e;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
      transition: all 0.16s ease;
    }
    .upgrade-btn:hover {
      background: linear-gradient(180deg, #35353b 0%, #2c2c31 100%);
      border-color: #46464e;
    }

    /* Drag and drop visual feedback */
    .kanban-card {
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .kanban-card:hover {
      border-color: #34343a;
      background-color: #1d1d21;
    }
    .kanban-card.dragging {
      opacity: 0.48;
      transform: scale(0.98);
    }
    .kanban-column.drag-over {
      background-color: rgba(59, 130, 246, 0.04);
      border-radius: 14px;
    }

    /* Segmented vertical ticks matching reference 1:1 */
    .tick-bar-container {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
    }
    .tick-segment {
      width: 2.5px;
      height: 11px;
      border-radius: 1.5px;
      transition: background-color 0.2s ease;
    }

    /* Smooth drawer & modal animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.97) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }
    .animate-slide-right {
      animation: slideInRight 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-scale-in {
      animation: scaleIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.courses && Array.isArray(parsed.courses) && parsed.courses.length === 3) {
          COURSES = parsed.courses;
        }
        if (parsed.appState) {
          appState = {
            ...appState,
            ...parsed.appState,
            selectedCardId: null,
            draggedCardId: null
          };
        }
      } catch (e) {
        // Fallback silently to defaults
      }
    }

    function savePersistedState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          courses: COURSES,
          appState: {
            userName: appState.userName,
            activeCourseId: appState.activeCourseId,
            activeViewTab: appState.activeViewTab,
            quizAnswers: appState.quizAnswers,
            dailyGoal: appState.dailyGoal,
            completedToday: appState.completedToday,
            exams: appState.exams,
            quickNotes: appState.quickNotes,
            flashcards: appState.flashcards,
            notifications: appState.notifications
          }
        }));
      } catch (e) {
        // Ignore storage quota errors
      }
    }

    /**
     * Renders the exact 16-tick segmented vertical bar progress indicator from the screenshot:
     * 16 vertical bars (2.5px wide x 11px tall, 2.5px gap), cobalt blue (#3B82F6) for completed ratio
     * and dark charcoal (#323237) for remaining steps.
     */
    function renderSegmentedTicks(completedSteps, totalSteps) {
      const totalTicks = 16;
      const ratio = totalSteps > 0 ? Math.min(1, Math.max(0, completedSteps / totalSteps)) : 0;
      const activeTicks = Math.round(ratio * totalTicks);
      let ticksHtml = '<div class="tick-bar-container" aria-hidden="true">';
      for (let i = 0; i < totalTicks; i++) {
        const isFilled = i < activeTicks;
        ticksHtml += `<span class="tick-segment" style="background-color: ${isFilled ? '#3B82F6' : '#323237'};"></span>`;
      }
      ticksHtml += '</div>';
      return ticksHtml;
    }

    }

          <!-- Row 2: Study Module Title -->
          <h3 class="mt-3 text-[14.5px] font-semibold text-[#F2F2F4] leading-[1.35] tracking-[-0.01em] group-hover:text-white transition">
            ${escapeHtml(card.title)}
          </h3>

          <!-- Row 3: Metadata Icons & Counts (Lessons, Notes, Duration) -->
          <div class="mt-2.5 flex items-center gap-3.5 text-[12px] text-[#7E7E85]">
            <!-- Sub-lessons icon + count -->
            <span class="inline-flex items-center gap-1" title="Lektionen">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-[#78787F]">

              </svg>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-[#78787F] -ml-0.5">
                <rect x="4" y="3" width="16" height="18" rx="2" />
                <line x1="8" y1="8" x2="16" y2="8" />
                <line x1="8" y1="12" x2="14" y2="12" />
              </svg>
              <span>${card.lessonsCount}</span>
            </span>

            <!-- Notes / comments icon + count -->
            <span class="inline-flex items-center gap-1" title="Lernnotizen">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-[#78787F]">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
              </svg>
              <span>${card.notesCount}</span>
            </span>

            <!-- Stopwatch icon + duration -->
            <span class="inline-flex items-center gap-1" title="Verbleibende Lernzeit">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-[#78787F]">
                <circle cx="12" cy="13" r="8" />
                <path d="M12 9v4l2 2" />
                <path d="M9 2h6" />

              <span>${escapeHtml(card.duration)}</span>

          <!-- Horizontal Card Divider -->
          <div class="h-px bg-[#232327] my-3.5"></div>

          <!-- Row 4: Segmented Vertical Tick Bar + Ratio + Peer Avatars -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
              ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
              <span class="text-[12px] tracking-tight">
                <span class="font-semibold text-[#E4E4E7]">${card.completedSteps}</span>
                <span class="text-[#78787F]"> / ${card.totalSteps}</span>
              </span>
            </div>
            ${renderAvatarPair(card.avatars)}
          </div>
        </article>
      `;
    }

    // =========================================================================
    // 3. MAIN WORKSPACE RENDERERS (Project + 4 View Tabs + All Sidebar Views)
    // =========================================================================

    function renderWorkspace() {
      const container = document.getElementById('workspace-container');
      if (!container) return;

      if (appState.activeNav === 'projects') {
        container.innerHTML = appState.showSubjectOverview
          ? renderSubjectsOverview()
          : renderProjectsWorkspace();
      } else if (appState.activeNav === 'dashboard') {
        container.innerHTML = renderDashboardView();
      } else if (appState.activeNav === 'inbox') {
        container.innerHTML = renderInboxView();
      } else if (appState.activeNav === 'calendar') {
        container.innerHTML = renderCalendarView();
      } else if (appState.activeNav === 'reports') {
        container.innerHTML = renderReportsView();
      } else if (appState.activeNav === 'help') {
        container.innerHTML = renderHelpView();
      } else if (appState.activeNav === 'settings') {
        container.innerHTML = renderSettingsView();
      }
    }

    function renderSubjectsOverview() {
      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="mb-6">
            <p class="text-[13px] text-[#8E8E93] mb-1">Alle Lernfächer im Überblick</p>
            <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em]">Deine 3 Lernprojekte</h1>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-5 max-w-5xl">
            ${COURSES.map(c => {
              const doneSteps = c.cards.reduce((sum, item) => sum + item.completedSteps, 0);
              const allSteps = c.cards.reduce((sum, item) => sum + item.totalSteps, 0);
              const pct = allSteps > 0 ? Math.round((doneSteps / allSteps) * 100) : 0;
              return `
                <div onclick="openSubjectBoard('${c.id}')"
                     class="bg-[#1A1A1D] hover:bg-[#1E1E22] border border-[#26262A] hover:border-[#3B82F6]/50 rounded-[14px] p-5 cursor-pointer transition flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between mb-4">
                      <svg width="32" height="27" viewBox="0 0 36 30" fill="none">
                        <path d="M2 5.5C2 3.567 3.567 2 5.5 2H12.6C13.65 2 14.64 2.47 15.3 3.28L16.7 5H30.5C32.433 5 34 6.567 34 8.5V24.5C34 26.433 32.433 28 30.5 28H5.5C3.567 28 2 26.433 2 24.5V5.5Z" fill="#2563EB" />
                        <path d="M2 9.5C2 7.843 3.343 6.5 5 6.5H31C32.657 6.5 34 7.843 34 9.5V24.5C34 26.433 32.433 28 30.5 28H5.5C3.567 28 2 26.433 2 24.5V9.5Z" fill="#3B82F6" />
                      </svg>
                      <span class="text-[12px] font-medium text-[#60A5FA] bg-[#3B82F6]/15 border border-[#3B82F6]/25 px-2.5 py-0.5 rounded-full">
                        ${pct}% abgeschlossen
                      </span>
                    </div>
                    <h2 class="text-[18px] font-bold text-[#F4F4F6] mb-1.5">${escapeHtml(c.title)}</h2>
                    <p class="text-[13px] text-[#8E8E93] leading-relaxed mb-5">${escapeHtml(c.description)}</p>

                  <div>
                    <div class="h-px bg-[#242428] mb-3.5"></div>
                    <div class="flex items-center justify-between">
                      <div class="flex items-center gap-2">
                        ${renderSegmentedTicks(doneSteps, allSteps)}
                        <span class="text-[12px] text-[#9A9AA0]">${doneSteps}/${allSteps}</span>
                      </div>
                      <span class="text-[12.5px] font-medium text-[#E4E4E7]">Board öffnen →</span>
                    </div>
                  </div>
                </div>
              `;

          </div>
        </div>

    function renderProjectsWorkspace() {
      const course = getCurrentCourse();
      const viewTab = appState.activeViewTab;

      let activeContentHtml = '';
      if (viewTab === 'kanban') {
        activeContentHtml = renderKanbanBoard(course);
      } else if (viewTab === 'list') {
        activeContentHtml = renderListView(course);
      } else if (viewTab === 'timeline') {
        activeContentHtml = renderTimelineView(course);
      } else if (viewTab === 'table') {
        activeContentHtml = renderTableView(course);
      }

      return `
        <!-- Top Course Header Section (matches reference spacing & alignment 1:1) -->
        <div class="px-6 sm:px-9 pt-6 sm:pt-7 pb-4 shrink-0">

          <div class="flex items-center gap-2 text-[13px] mb-5">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <!-- Vibrant Cobalt Blue Folder Icon (1:1 match to screenshot) -->
              <div class="shrink-0 flex items-center justify-center">
                <svg width="36" height="30" viewBox="0 0 36 30" fill="none">
                  <path d="M2 5.5C2 3.567 3.567 2 5.5 2H12.6C13.65 2 14.64 2.47 15.3 3.28L16.7 5H30.5C32.433 5 34 6.567 34 8.5V24.5C34 26.433 32.433 28 30.5 28H5.5C3.567 28 2 26.433 2 24.5V5.5Z" fill="#2563EB" />
                  <path d="M2 9.5C2 7.843 3.343 6.5 5 6.5H31C32.657 6.5 34 7.843 34 9.5V24.5C34 26.433 32.433 28 30.5 28H5.5C3.567 28 2 26.433 2 24.5V9.5Z" fill="#3B82F6" />
                </svg>

              <h1 class="text-[24px] sm:text-[28px] font-bold text-[#F4F4F6] tracking-[-0.02em] leading-tight">

            <div class="inline-flex items-center bg-[#161618] border border-[#242428] rounded-[9px] p-1 gap-1 max-w-full overflow-x-auto">
              ${COURSES.map(c => {

                    ${escapeHtml(c.title)}

          <!-- View Switcher Pill Bar (Kanban | List | Timeline | Table) -->
          <div class="inline-flex items-center bg-[#18181B] border border-[#242428] rounded-[10px] p-1 gap-1 max-w-full overflow-x-auto">
            ${renderViewTabButton('kanban', 'Kanban', `
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <line x1="8" y1="6" x2="20" y2="6" />
                <line x1="8" y1="12" x2="20" y2="12" />
                <line x1="8" y1="18" x2="20" y2="18" />
                <circle cx="4" cy="6" r="1" fill="currentColor" />
                <circle cx="4" cy="12" r="1" fill="currentColor" />

                <line x1="8" y1="12" x2="20" y2="12" />
                <line x1="6" y1="17" x2="16" y2="17" />

            `)}
            ${renderViewTabButton('table', 'Table', `
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <line x1="3" y1="10" x2="21" y2="10" />
                <line x1="9" y1="4" x2="9" y2="20" />

        <!-- Subtle Horizontal Separator above Board -->
        <div class="h-px bg-[#1E1E22] mx-6 sm:mx-9 shrink-0"></div>

        <!-- Main View Body -->
        <div class="flex-1 overflow-auto px-6 sm:px-9 pt-5 pb-8">
          ${activeContentHtml}
        </div>

    function renderViewTabButton(tabId, label, iconSvg) {
      const isActive = appState.activeViewTab === tabId;
      if (isActive) {
        return `
          <button onclick="switchViewTab('${tabId}')"
                  class="inline-flex items-center gap-2 px-3 py-1.5 rounded-[7px] text-[13px] font-medium bg-[#252529] border border-[#35353B] text-[#F4F4F6] shadow-sm transition shrink-0">
            ${iconSvg}
            <span>${label}</span>
          </button>
        `;
      }
      return `
        <button onclick="switchViewTab('${tabId}')"
                class="inline-flex items-center gap-2 px-3 py-1.5 rounded-[7px] text-[13px] font-normal text-[#8E8E93] hover:text-[#E4E4E7] hover:bg-[#1F1F23] border border-transparent transition shrink-0">
          ${iconSvg}
          <span>${label}</span>
        </button>
      `;
    }

    function renderKanbanBoard(course) {
      const columns = [
        { id: 'todo', title: 'To Do', barColor: '#787572' },
        { id: 'inprogress', title: 'In Progress', barColor: '#3B82F6' },
        { id: 'completed', title: 'Done', barColor: '#10B981' }
      ];

      return `
        <div class="flex items-start gap-5 min-w-max pb-4">
          ${columns.map(col => {
            const colCards = course.cards.filter(c => c.column === col.id);
            return `
              <section
                data-column="${col.id}"
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event, '${col.id}')"
                class="kanban-column w-[312px] shrink-0 flex flex-col"
              >
                <!-- Column Header -->
                <div class="flex items-center justify-between px-1 mb-4">
                  <div class="flex items-center gap-2.5">
                    <span class="w-[3px] h-[15px] rounded-[2px]" style="background-color: ${col.barColor};"></span>
                    <h2 class="text-[14.5px] font-medium text-[#E4E4E7] tracking-[-0.01em]">${col.title}</h2>
                  </div>
                  <button onclick="openAddCardModal('${col.id}')" title="Neues Lernmodul hinzufügen" class="text-[#78787F] hover:text-[#E4E4E7] p-1 rounded transition">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                      <circle cx="12" cy="5" r="1.6" />
                      <circle cx="12" cy="12" r="1.6" />
                      <circle cx="12" cy="19" r="1.6" />
                    </svg>
                  </button>
                </div>

                <!-- Column Cards Stack -->
                <div class="flex flex-col gap-3.5">
                  ${colCards.map(card => renderKanbanCard(card)).join('')}
                </div>

                <!-- "+ Add New" Button below cards (1:1 match to screenshot) -->
                <button onclick="openAddCardModal('${col.id}')"
                        class="mt-3.5 inline-flex items-center gap-2 px-1.5 py-2 rounded-[8px] text-[13.5px] font-medium text-[#9A9AA0] hover:text-[#F4F4F6] hover:bg-[#19191D] transition w-fit">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  <span>Add New</span>
                </button>
              </section>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderListView(course) {
      const groups = [
        { id: 'todo', title: 'To Do', barColor: '#787572' },
        { id: 'inprogress', title: 'In Progress', barColor: '#3B82F6' },
        { id: 'completed', title: 'Done', barColor: '#10B981' }
      ];

      return `
        <div class="max-w-4xl space-y-6">
          ${groups.map(g => {
            const cards = course.cards.filter(c => c.column === g.id);
            return `
              <div class="bg-[#161618] border border-[#242428] rounded-[12px] overflow-hidden">
                <div class="flex items-center justify-between px-4 py-3 border-b border-[#222226]">
                  <div class="flex items-center gap-2.5">
                    <span class="w-[3px] h-[14px] rounded-[2px]" style="background-color: ${g.barColor};"></span>
                    <span class="text-[14px] font-medium text-[#F4F4F6]">${g.title}</span>
                    <span class="text-[12px] text-[#78787F] bg-[#1F1F23] px-2 py-0.5 rounded-full">${cards.length}</span>
                  </div>
                  <button onclick="openAddCardModal('${g.id}')" class="text-[12.5px] text-[#9A9AA0] hover:text-white inline-flex items-center gap-1">
                    <span>+ Add New</span>
                  </button>
                </div>
                <div class="divide-y divide-[#222226]">
                  ${cards.map(card => `
                    <div onclick="openModuleDrawer('${card.id}')" class="flex items-center justify-between gap-4 px-4 py-3.5 hover:bg-[#1C1C20] cursor-pointer transition flex-wrap">
                      <div class="flex items-center gap-3 min-w-[240px]">
                        ${renderPriorityBadge(card.priority)}
                        ${renderCategoryBadge(card.category)}
                        <span class="text-[14px] font-medium text-[#F2F2F4]">${escapeHtml(card.title)}</span>
                      </div>
                      <div class="flex items-center gap-5">
                        <span class="text-[12px] text-[#7E7E85]">${card.lessonsCount} Lektionen • ${card.duration}</span>
                        <div class="flex items-center gap-2">
                          ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
                          <span class="text-[12px] text-[#E4E4E7] font-medium">${card.completedSteps} / ${card.totalSteps}</span>
                        </div>
                        ${renderAvatarPair(card.avatars)}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderTimelineView(course) {
      const weeks = ['Woche 1', 'Woche 2', 'Woche 3', 'Woche 4'];
      return `
        <div class="max-w-5xl bg-[#161618] border border-[#242428] rounded-[12px] p-5">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-[15px] font-semibold text-[#F4F4F6]">Lern-Roadmap &amp; Zeitplan</h3>
            <span class="text-[12px] text-[#8E8E93]">Klicke auf einen Balken, um das Lernmodul zu öffnen</span>
          </div>
          <div class="grid grid-cols-4 gap-2 pb-3 border-b border-[#242428] text-[12px] font-medium text-[#8E8E93]">
            ${weeks.map(w => `<div>${w}</div>`).join('')}
          </div>
          <div class="divide-y divide-[#222226]">
            ${course.cards.map((card, idx) => {
              const offsetPercent = (idx * 14) % 45;
              const widthPercent = Math.min(55, 38 + (idx % 3) * 8);
              const barBg = card.column === 'completed' ? '#10B981' : card.column === 'inprogress' ? '#3B82F6' : '#52525B';
              return `
                <div onclick="openModuleDrawer('${card.id}')" class="py-3.5 hover:bg-[#1B1B1F] px-2 rounded-lg cursor-pointer transition">
                  <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                      ${renderCategoryBadge(card.category)}
                      <span class="text-[13.5px] font-medium text-[#F4F4F6]">${escapeHtml(card.title)}</span>
                    </div>
                    <span class="text-[12px] text-[#8E8E93]">${card.completedSteps} / ${card.totalSteps} • ${card.duration}</span>
                  </div>
                  <div class="w-full h-6 bg-[#111113] rounded-[6px] relative overflow-hidden border border-[#242428]">
                    <div class="absolute top-1 bottom-1 rounded-[4px] flex items-center px-2.5 text-[11px] font-medium text-white"
                         style="left: ${offsetPercent}%; width: ${widthPercent}%; background-color: ${barBg};">
                      ${Math.round((card.completedSteps / card.totalSteps) * 100)}%
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderTableView(course) {
      const statusLabels = {
        todo: { text: 'To Do', color: '#9A9AA0' },
        inprogress: { text: 'In Progress', color: '#60A5FA' },
        completed: { text: 'Done', color: '#34D399' }
      };

      return `
        <div class="max-w-5xl bg-[#161618] border border-[#242428] rounded-[12px] overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-[#242428] text-[12px] font-medium text-[#8E8E93]">
                <th class="py-3 px-4">Lernmodul</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4">Priorität</th>
                <th class="py-3 px-4">Fachbereich</th>
                <th class="py-3 px-4">Fortschritt</th>
                <th class="py-3 px-4">Zeitrahmen</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-[#222226] text-[13.5px]">
              ${course.cards.map(card => {
                const st = statusLabels[card.column] || statusLabels.todo;
                return `
                  <tr onclick="openModuleDrawer('${card.id}')" class="hover:bg-[#1C1C20] cursor-pointer transition">
                    <td class="py-3.5 px-4 font-medium text-[#F4F4F6]">${escapeHtml(card.title)}</td>
                    <td class="py-3.5 px-4 text-[12.5px]" style="color: ${st.color};">${st.text}</td>
                    <td class="py-3.5 px-4">${renderPriorityBadge(card.priority)}</td>
                    <td class="py-3.5 px-4">${renderCategoryBadge(card.category)}</td>
                    <td class="py-3.5 px-4">
                      <div class="flex items-center gap-2.5">
                        ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
                        <span class="text-[12px] text-[#E4E4E7]">${card.completedSteps} / ${card.totalSteps}</span>
                      </div>
                    </td>
                    <td class="py-3.5 px-4 text-[12.5px] text-[#8E8E93]">${escapeHtml(card.duration)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // =========================================================================
    // 4. FUNCTIONAL SIDEBAR SECTIONS (Dashboard, Inbox, Calendar, Reports, Help, Settings)
    // =========================================================================

    function formatGermanDate(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function renderCalendarView() {
      const monthNames = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
      const year = appState.calendarYear;

      const startOffset = firstDayRaw === 0 ? 6 : firstDayRaw - 1; // Monday-first
      const daysInMonth = new Date(year, month + 1, 0).getDate();

        </div>
      `;

    function openModuleDrawer(cardId) {
      appState.selectedCardId = cardId;
      const overlay = document.getElementById('module-drawer-overlay');
      if (overlay) overlay.classList.remove('hidden');
      renderModuleDrawerContent();
    }

    function closeModuleDrawer() {
      appState.selectedCardId = null;
      const overlay = document.getElementById('module-drawer-overlay');
      if (overlay) overlay.classList.add('hidden');
    }

    function renderModuleDrawerContent() {
      const card = getCardById(appState.selectedCardId);
      if (!card) return;

      const selectedQuizIdx = appState.quizAnswers[card.id];
      const hasAnsweredQuiz = selectedQuizIdx !== undefined;
      const isQuizCorrect = selectedQuizIdx === card.quiz.correctIndex;

      const container = document.getElementById('module-drawer-content');
      if (!container) return;
      container.innerHTML = `
        <!-- Drawer Top Bar -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-[#242428] shrink-0">
          <div class="flex items-center gap-2">
            ${renderPriorityBadge(card.priority)}
            ${renderCategoryBadge(card.category)}
          </div>
          <div class="flex items-center gap-2">
            <select onchange="moveCardColumn('${card.id}', this.value)"
                    class="bg-[#222226] border border-[#323238] rounded-[7px] px-2.5 py-1 text-[12px] text-[#E4E4E7] focus:outline-none">
              <option value="todo" ${card.column === 'todo' ? 'selected' : ''}>To Do</option>
              <option value="inprogress" ${card.column === 'inprogress' ? 'selected' : ''}>In Progress</option>
              <option value="completed" ${card.column === 'completed' ? 'selected' : ''}>Done</option>
            </select>
            <button onclick="closeModuleDrawer()" class="p-1.5 rounded-lg text-[#8E8E93] hover:text-white hover:bg-[#242428] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Drawer Scrollable Body -->
        <div class="flex-1 overflow-y-auto px-6 py-5 space-y-6">
          <!-- Title & Live Progress -->
          <div>
            <h2 class="text-[20px] font-bold text-[#F4F4F6] tracking-[-0.015em] mb-2">${escapeHtml(card.title)}</h2>
            <p class="text-[13.5px] text-[#9A9AA0] leading-relaxed mb-4">${escapeHtml(card.summary)}</p>

            <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[10px] p-3.5 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
                <span class="text-[13px] font-semibold text-[#F4F4F6]">${card.completedSteps} / ${card.totalSteps} Lektionen</span>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="adjustSteps('${card.id}', -1)" class="w-7 h-7 rounded bg-[#242428] hover:bg-[#2F2F35] text-[#E4E4E7] text-[14px] font-medium">−</button>
                <button onclick="adjustSteps('${card.id}', 1)" class="w-7 h-7 rounded bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[14px] font-medium">+</button>
              </div>
            </div>
          </div>

          <!-- Lernstoff / Theorie -->
          <div class="space-y-3">
            <h3 class="text-[13.5px] font-semibold uppercase tracking-wider text-[#8E8E93]">Kompaktwissen &amp; Theorie</h3>
            ${card.theory.map(t => `
              <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[10px] p-4">
                <h4 class="text-[14px] font-semibold text-[#F4F4F6] mb-1">${escapeHtml(t.heading)}</h4>
                <p class="text-[13px] text-[#9A9AA0] leading-relaxed">${escapeHtml(t.body)}</p>
              </div>
            `).join('')}
            ${card.codeExample ? `
              <pre class="bg-[#111113] border border-[#26262A] rounded-[10px] p-3.5 text-[12px] text-[#93C5FD] overflow-x-auto font-mono leading-relaxed"><code>${escapeHtml(card.codeExample)}</code></pre>
            ` : ''}
          </div>

          <!-- Interaktive Lektions-Checkliste -->
          <div>
            <h3 class="text-[13.5px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-3">Lernziele &amp; Checkliste</h3>
            <div class="space-y-2">

                <label onclick="toggleChecklistItem('${card.id}', ${idx})"

          <!-- Interaktiver Wissens-Check (Quiz) -->

                if (hasAnsweredQuiz) {
                  if (idx === card.quiz.correctIndex) {
                    btnStyle = 'bg-[#10B981]/15 border-[#10B981]/40 text-[#6EE7B7]';
                  } else if (idx === selectedQuizIdx) {
                    btnStyle = 'bg-[#EF4444]/15 border-[#EF4444]/40 text-[#FCA5A5]';

                  <button onclick="answerQuiz('${card.id}', ${idx})"
                          class="w-full text-left px-3.5 py-2.5 rounded-[8px] border text-[13px] transition ${btnStyle}">
                    ${escapeHtml(opt)}
                  </button>
                `;
              }).join('')}
            </div>
            ${hasAnsweredQuiz ? `
              <div class="mt-3 text-[12.5px] leading-relaxed p-3 rounded-[8px] ${isQuizCorrect ? 'bg-[#10B981]/10 text-[#6EE7B7]' : 'bg-[#F59E0B]/10 text-[#FCD34D]'}">
                ${escapeHtml(card.quiz.explanation)}
              </div>
            ` : ''}
          </div>

          <!-- Lernnotizen -->

            <h3 class="text-[13.5px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-3">Lernnotizen (${card.notes.length})</h3>

              ${card.notes.map(note => `

            <form onsubmit="addModuleNote(event, '${card.id}')" class="flex gap-2">
              <input id="new-note-input" type="text" placeholder="Eigene Lernnotiz hinzufügen..."
                     class="flex-1 bg-[#111113] border border-[#2A2A30] rounded-[8px] px-3 py-2 text-[13px] text-[#F4F4F6] placeholder-[#686870] focus:outline-none focus:border-[#3B82F6]" />
              <button type="submit" class="px-3.5 py-2 rounded-[8px] bg-[#252529] hover:bg-[#303036] border border-[#35353C] text-[13px] font-medium text-[#F4F4F6] transition">
                Speichern

            </form>
          </div>
        </div>
      `;

    function renderSearchResults(query) {
      const q = query.trim().toLowerCase();
      const allCards = COURSES.flatMap(course => course.cards.map(card => ({ ...card, courseTitle: course.title, courseId: course.id })));
      const matches = q
        ? allCards.filter(c => c.title.toLowerCase().includes(q) || c.category.toLowerCase().includes(q) || c.courseTitle.toLowerCase().includes(q))
        : allCards;

      if (matches.length === 0) {
        return `<div class="py-8 text-center text-[13px] text-[#78787F]">Keine passenden Lernmodule gefunden.</div>`;
      }

      return matches.map(m => `
        <button onclick="selectSearchResult('${m.courseId}', '${m.id}')"
                class="w-full text-left p-2.5 rounded-[8px] hover:bg-[#222227] flex items-center justify-between gap-3 transition">
          <div>
            <div class="text-[13.5px] font-medium text-[#F4F4F6]">${escapeHtml(m.title)}</div>
            <div class="text-[11.5px] text-[#78787F]">${escapeHtml(m.courseTitle)} • ${escapeHtml(m.category)}</div>
          </div>
          <span class="text-[12px] text-[#60A5FA] font-medium">${m.completedSteps}/${m.totalSteps}</span>
        </button>
      `).join('');
    }

    function filterSearchResults(val) {
      const list = document.getElementById('search-results-list');
      if (list) list.innerHTML = renderSearchResults(val);
    }

                  <p class="text-[12px] text-[#8E8E93] mb-3">${escapeHtml(tpl.desc)}</p>
                  <button onclick="applyStudyTemplate('${tpl.id}')"
                          class="px-3 py-1.5 rounded-[7px] bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[12px] font-medium transition">
                    + Als Lernkarte in ${escapeHtml(targetCourse ? targetCourse.title : 'Fach')} einfügen
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `);
    }

    function applyStudyTemplate(tplId) {
      const tpl = STUDY_TEMPLATES.find(t => t.id === tplId);
      if (!tpl) return;
      const targetCourse = COURSES.find(c => c.id === tpl.courseId) || COURSES[0];
      targetCourse.cards.unshift({
        id: 'tpl-card-' + Date.now(),
        column: 'todo',
        priority: tpl.priority,
        category: tpl.category,
        title: tpl.title,
        lessonsCount: tpl.totalSteps,
        notesCount: 1,
        duration: tpl.duration,
        completedSteps: 0,
        totalSteps: tpl.totalSteps,
        avatars: [0, 1],
        summary: tpl.desc,
        theory: [
          { heading: 'Struktur & Vorgehen', body: tpl.desc }
        ],
        codeExample: tpl.checklist.join('\n'),
        checklist: tpl.checklist.map((text, idx) => ({ id: 'tc-' + idx, text, done: false })),
        quiz: {
          question: `Hast du alle Schritte aus der Vorlage „${tpl.title}“ durchgearbeitet?`,
          options: ['Ja, vollständig angewendet', 'Noch in Arbeit'],
          correctIndex: 0,
          explanation: 'Klasse! Strukturierte Lern-Vorlagen sparen Zeit vor Prüfungen.'
        },
        notes: [
          { author: appState.userName, time: 'Gerade eben', text: 'Aus Lern-Vorlagen eingefügt.' }
        ]
      });

      appState.activeCourseId = targetCourse.id;
      appState.showSubjectOverview = false;
      appState.activeNav = 'projects';
      savePersistedState();
      closeModal();
      renderWorkspace();
      showToast(`Vorlage in „${targetCourse.title}“ eingefügt`);
    }

    function openNotificationsModal() {
      appState.notifications.forEach(n => n.unread = false);
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.add('hidden');
      savePersistedState();

      openModal(`
        <div class="p-5">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-[16px] font-semibold text-[#F4F4F6]">Benachrichtigungen</h3>
            <button onclick="closeModal()" class="text-[#78787F] hover:text-white p-1">✕</button>
          </div>
          <div class="space-y-2.5 max-h-[340px] overflow-y-auto">
            ${appState.notifications.map(n => `
              <div class="p-3 rounded-[9px] bg-[#141416] border border-[#26262B]">
                <div class="flex justify-between text-[12px] mb-1">
                  <span class="font-semibold text-[#F4F4F6]">${escapeHtml(n.title)}</span>
                  <span class="text-[#78787F]">${escapeHtml(n.time)}</span>
                </div>
                <p class="text-[12.5px] text-[#9A9AA0]">${escapeHtml(n.desc)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `);
    }

    function openProModal() {
      openModal(`
        <div class="p-6 text-center">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#3B82F6]/15 border border-[#3B82F6]/30 text-[#60A5FA] mb-3">
            ✦
          </div>
          <h3 class="text-[18px] font-bold text-[#F4F4F6] mb-1.5">Studyplus Pro</h3>
          <p class="text-[13px] text-[#9A9AA0] mb-5">Unbegrenzte Lernprojekte, erweiterte Karteikarten-Decks und Prüfungsexport für alle Fächer.</p>
          <div class="text-left bg-[#131315] border border-[#26262B] rounded-[10px] p-4 space-y-2 text-[13px] text-[#D4D4D8] mb-5">
            <div>✓ Unbegrenzte Fächer &amp; eigene Kanban-Boards</div>
            <div>✓ Unbegrenzte Karteikarten-Decks &amp; Lernstatistiken</div>
            <div>✓ Export von Zusammenfassungen &amp; Lernplänen</div>
          </div>
          <button onclick="closeModal(); showToast('Studyplus Pro 14-Tage-Testphase aktiviert!');"
                  class="w-full py-2.5 rounded-[8px] bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[13.5px] font-medium transition">
            14 Tage kostenlos testen
          </button>
        </div>
      `);
    }

    // =========================================================================
    // 7. INTERACTION HANDLERS
    // =========================================================================

    function navigateSection(navId) {
      appState.activeNav = navId;
      if (navId === 'projects') {
        appState.showSubjectOverview = false;
      }
      document.querySelectorAll('.nav-item').forEach(btn => {
        const isTarget = btn.getAttribute('data-nav') === navId;
        if (isTarget) {
          btn.className = 'nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-[8px] text-[13.5px] font-medium bg-[#232327] border border-[#323237] text-[#F4F4F6] transition';
        } else {
          btn.className = 'nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-[8px] text-[13.5px] text-[#9A9AA0] hover:text-[#F4F4F6] hover:bg-[#1E1E22] transition';
        }
      });
      toggleMobileSidebar(false);
      renderWorkspace();
    }

    function openSubjectsOverview() {
      appState.showSubjectOverview = true;
      renderWorkspace();
    }

    function openSubjectBoard(courseId) {
      appState.activeCourseId = courseId;
      appState.showSubjectOverview = false;
      appState.activeNav = 'projects';
      savePersistedState();
      renderWorkspace();
    }

    function switchViewTab(tabId) {
      appState.activeViewTab = tabId;
      savePersistedState();
      renderWorkspace();
    }

    function switchCourseById(courseId) {
      appState.activeCourseId = courseId;
      appState.showSubjectOverview = false;
      appState.activeNav = 'projects';
      savePersistedState();
      renderWorkspace();
    }

    function toggleMobileSidebar(open) {
      const sidebar = document.getElementById('left-sidebar');
      const backdrop = document.getElementById('mobile-sidebar-backdrop');
      if (open) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    function dismissPromoCard() {
      const el = document.getElementById('promo-card');
      if (el) el.style.display = 'none';
    }

    // Drag & Drop handlers
    function handleDragStart(event, cardId) {
      appState.draggedCardId = cardId;
      event.currentTarget.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(event) {
      event.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.kanban-column').forEach(col => col.classList.remove('drag-over'));
    }

    function handleDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(event, targetColumn) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      if (!appState.draggedCardId) return;
      moveCardColumn(appState.draggedCardId, targetColumn);
      appState.draggedCardId = null;
    }

    function moveCardColumn(cardId, targetColumn) {
      const card = getCardById(cardId);
      if (!card) return;
      card.column = targetColumn;
      if (targetColumn === 'completed') {
        card.completedSteps = card.totalSteps;
      }
      savePersistedState();
      renderWorkspace();
      if (appState.selectedCardId === cardId) {
        renderModuleDrawerContent();
      }
      showToast(`Modul nach „${targetColumn === 'todo' ? 'To Do' : targetColumn === 'inprogress' ? 'In Progress' : 'Done'}“ verschoben`);
    }

    function adjustSteps(cardId, delta) {
      const card = getCardById(cardId);
      if (!card) return;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + delta));
      if (delta > 0) appState.completedToday += 1;
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function toggleChecklistItem(cardId, itemIdx) {
      const card = getCardById(cardId);
      if (!card || !card.checklist[itemIdx]) return;
      const item = card.checklist[itemIdx];
      item.done = !item.done;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + (item.done ? 1 : -1)));
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function answerQuiz(cardId, optionIdx) {
      appState.quizAnswers[cardId] = optionIdx;
      const card = getCardById(cardId);
      if (card && optionIdx === card.quiz.correctIndex) {
        showToast('Richtige Antwort! +10 Lernpunkte');
      }
      savePersistedState();
      renderModuleDrawerContent();
    }

    function addModuleNote(event, cardId) {
      event.preventDefault();
      const input = document.getElementById('new-note-input');
      if (!input || !input.value.trim()) return;
      const card = getCardById(cardId);
      if (!card) return;
      card.notes.unshift({
        author: appState.userName,
        time: 'Gerade eben',
        text: input.value.trim()
      });
      card.notesCount = card.notes.length;
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
      showToast('Lernnotiz gespeichert');
    }

    function submitNewCard(event, columnId) {
      event.preventDefault();
      const title = document.getElementById('card-title-input')?.value.trim();
      const priority = document.getElementById('card-priority-input')?.value || 'Medium';
      const category = document.getElementById('card-category-input')?.value.trim() || 'Theorie';
      const totalSteps = parseInt(document.getElementById('card-total-input')?.value || '16', 10);
      const duration = document.getElementById('card-duration-input')?.value.trim() || '4 days';

      if (!title) return;
      const course = getCurrentCourse();
      course.cards.push({
        id: 'mod-' + Date.now(),
        column: columnId,
        priority,
        category,
        title,
        lessonsCount: totalSteps,
        notesCount: 1,
        duration,
        completedSteps: columnId === 'completed' ? totalSteps : 0,
        totalSteps,
        avatars: [0, 1],
        summary: `Individuelles Lernmodul im Fach ${course.title} (${category}).`,
        theory: [
          {
            heading: 'Lernziel & Überblick',
            body: `Strukturierte Einarbeitung in ${title} mit Übungsaufgaben und Selbsttest.`
          }
        ],
        codeExample: '',
        checklist: [
          { id: 'n1', text: 'Grundlagen & Mitschriften durcharbeiten', done: false },
          { id: 'n2', text: 'Übungsaufgaben selbstständig lösen', done: false }
        ],
        quiz: {
          question: `Hast du die wichtigsten Inhalte zu „${title}“ bereits wiederholt?`,
          options: ['Ja, Thema sitzt', 'Noch in Bearbeitung'],
          correctIndex: 0,
          explanation: 'Super! Regelmäßiges Wiederholen festigt das Wissen für die Klassenarbeit.'
        },
        notes: [
          { author: appState.userName, time: 'Gerade eben', text: 'Lernmodul neu angelegt.' }
        ]
      });

      savePersistedState();
      closeModal();
      renderWorkspace();
      showToast('Neues Lernmodul erstellt');
    }

    // Calendar & Exam handlers
    function changeCalendarMonth(delta) {
      let m = appState.calendarMonth + delta;
      let y = appState.calendarYear;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      appState.calendarMonth = m;
      appState.calendarYear = y;
      renderWorkspace();
    }

    function submitNewExam(event) {
      event.preventDefault();
      const subject = document.getElementById('exam-subject-input')?.value || 'Rechnungswesen';
      const type = document.getElementById('exam-type-input')?.value || 'Klassenarbeit';
      const date = document.getElementById('exam-date-input')?.value;
      const title = document.getElementById('exam-title-input')?.value.trim();
      const topics = document.getElementById('exam-topics-input')?.value.trim();
      if (!date || !title || !topics) return;

      const newExam = {
        id: 'exam-' + Date.now(),
        date,
        subject,
        type,
        title,
        topics
      };
      appState.exams.push(newExam);
      appState.notifications.unshift({
        id: 'notif-' + Date.now(),
        title: `Neuer Prüfungstermin: ${subject}`,
        desc: `${title} am ${formatGermanDate(date)} eingetragen.`,
        time: 'Gerade eben',
        unread: true
      });
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.remove('hidden');

      savePersistedState();
      closeModal();
      renderWorkspace();
      showToast('Klassenarbeit / Test im Kalender gespeichert');
    }

    function deleteExam(examId) {
      appState.exams = appState.exams.filter(e => e.id !== examId);
      savePersistedState();
      renderWorkspace();
      showToast('Termin entfernt');
    }

    // Inbox Flashcards & Quick Notes
    function flipFlashcard() {
      appState.flashcardFlipped = !appState.flashcardFlipped;
      renderWorkspace();
    }

    function nextFlashcard() {
      appState.activeFlashcardIndex = (appState.activeFlashcardIndex + 1) % Math.max(1, appState.flashcards.length);
      appState.flashcardFlipped = false;
      renderWorkspace();
    }

    function prevFlashcard() {
      const len = Math.max(1, appState.flashcards.length);
      appState.activeFlashcardIndex = (appState.activeFlashcardIndex - 1 + len) % len;
      appState.flashcardFlipped = false;
      renderWorkspace();
    }

    function markFlashcard(cardId, mastered) {
      const card = appState.flashcards.find(c => c.id === cardId);
      if (card) card.mastered = mastered;
      savePersistedState();
      nextFlashcard();
      showToast(mastered ? 'Als gewusst markiert' : 'Für Wiederholung vorgemerkt');
    }

    function addQuickNote(event) {
      event.preventDefault();
      const subject = document.getElementById('quick-note-subject')?.value || 'Rechnungswesen';
      const input = document.getElementById('quick-note-text');
      if (!input || !input.value.trim()) return;
      appState.quickNotes.unshift({
        id: 'qn-' + Date.now(),
        subject,
        text: input.value.trim(),
        time: 'Gerade eben'
      });
      savePersistedState();
      renderWorkspace();
      showToast('Merkzettel hinzugefügt');
    }

    function deleteQuickNote(noteId) {
      appState.quickNotes = appState.quickNotes.filter(n => n.id !== noteId);
      savePersistedState();
      renderWorkspace();
    }

    // Settings handlers
    function saveSettings() {
      const nameVal = document.getElementById('user-name-input')?.value.trim();
      const goalVal = parseInt(document.getElementById('daily-goal-input')?.value || '6', 10);
      if (nameVal) appState.userName = nameVal;
      if (goalVal >= 1 && goalVal <= 30) appState.dailyGoal = goalVal;
      savePersistedState();
      showToast('Einstellungen gespeichert');
    }

    function resetAllData() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      COURSES = getDefaultCourses();
      appState.exams = getDefaultExams();
      appState.flashcards = getDefaultFlashcards();
      appState.userName = 'Marlii';
      appState.dailyGoal = 6;
      appState.activeCourseId = 'rechnungswesen';
      renderWorkspace();
      showToast('Alle Lernprojekte & Termine zurückgesetzt');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'bg-[#202024] border border-[#34343B] text-[#F4F4F6] text-[12.5px] font-medium px-3.5 py-2.5 rounded-[9px] shadow-xl animate-scale-in';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Keyboard shortcuts (Cmd/Ctrl+K for Search, Escape to close overlays)
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
      } else if (e.key === 'Escape') {
        closeModal();
        closeModuleDrawer();
      }
    });

    // Initial load & render
    window.addEventListener('DOMContentLoaded', () => {
      loadPersistedState();
      renderWorkspace();
    });
  </script>
</body>
</html>
