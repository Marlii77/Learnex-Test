<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studyplus — Lernplattform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #111113;
      color: #F4F4F6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle Dark Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272C;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #383840;
    }

    /* 16-Tick Segmented Vertical Progress Bar (1:1 match to screenshot) */
    .tick-bar-container {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 12px;
    }

    .tick-segment {
      width: 2.5px;
      height: 11px;
      border-radius: 1px;
      transition: background-color 0.2s ease;
    }

    /* Kanban Card & Drag-and-Drop States */
    .kanban-card {
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.18s ease,
                  background-color 0.18s ease,
                  box-shadow 0.18s ease;
    }

    .kanban-card:hover {
      background-color: #1F1F23;
      border-color: #323238;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.55);
    }

    .kanban-card.dragging {
      opacity: 0.45;
      transform: scale(0.98);
    }

    .kanban-column {
      border-radius: 14px;
      border: 1px solid transparent;
    }

    .kanban-column.drag-over {
      background-color: rgba(59, 130, 246, 0.05);
      border-color: rgba(59, 130, 246, 0.28);
    }

    /* Drawer, Modal & Toast Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }

    .animate-slide-right {
      animation: slideRight 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-scale-in {
      animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Overarching Folder Cards (1:1 visual match to reference image + rich micro-animations) */
    @keyframes folderSlotReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ambientGlowBreath {
      0%, 100% {
        opacity: 0.82;
        transform: scale(1) translate(0, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1.07) translate(-3px, 2px);
      }
    }

    @keyframes starTwinkle {
      0%, 100% {
        opacity: 0.34;
        transform: scale(0.9) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.16) rotate(8deg);
      }
    }

    @keyframes starFloatGlint {
      0%, 100% {
        opacity: 0.25;
        transform: translateY(0px) scale(0.95);
      }
      50% {
        opacity: 0.85;
        transform: translateY(-2.5px) scale(1.2);
      }
    }

    .folder-card-slot {
      perspective: 950px;
      opacity: 0;
      animation: folderSlotReveal 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--stagger, 0) * 95ms);
    }

    .folder-glow-card {
      position: relative;
      background-color: #141416;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(0px);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.25s ease,
                  box-shadow 0.28s ease,
                  background-color 0.25s ease;
    }

    .folder-glow-card:hover {
      background-color: #17171a;
      border-color: rgba(var(--accent-rgb, 96, 165, 250), 0.45);
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
      box-shadow: 0 18px 38px -8px rgba(0, 0, 0, 0.65),
                  0 0 28px -6px rgba(var(--accent-rgb, 96, 165, 250), 0.22);
    }

    .folder-glow-card:active {
      transform: rotateX(0deg) rotateY(0deg) translateY(-1px) scale(0.985);
      transition-duration: 0.1s;
    }

    .folder-glow-orb {
      animation: ambientGlowBreath 6s ease-in-out infinite;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .folder-glow-card:hover .folder-glow-orb {
      opacity: 1;
      transform: scale(1.14) translate(-4px, 3px);
    }

    .folder-cursor-spotlight {
      opacity: 0;
      background: radial-gradient(
        240px circle at var(--mouse-x, 82%) var(--mouse-y, 18%),
        rgba(var(--accent-rgb, 96, 165, 250), 0.16),
        transparent 70%
      );
      transition: opacity 0.28s ease;
    }

    .folder-glow-card:hover .folder-cursor-spotlight {
      opacity: 1;
    }

    .folder-edge-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(var(--accent-rgb, 255, 255, 255), 0.65) 50%,
        transparent 100%
      );
      opacity: 0;
      transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .folder-glow-card:hover .folder-edge-shimmer {
      left: 100%;
      opacity: 1;
    }

    .folder-icon-wrap {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), filter 0.28s ease;
    }

    .folder-glow-card:hover .folder-icon-wrap {
      transform: translateY(-2px) scale(1.07);
      filter: drop-shadow(0 0 12px rgba(var(--accent-rgb, 96, 165, 250), 0.55));
    }

    .sparkle-star-lg {
      transform-origin: 111px 58px;
      animation: starTwinkle 3.8s ease-in-out infinite;
    }

    .sparkle-star-md {
      transform-origin: 77px 28.2px;
      animation: starTwinkle 4.4s ease-in-out 1.1s infinite;
    }

    .sparkle-star-sm {
      transform-origin: 104px 17.2px;
      animation: starFloatGlint 3.2s ease-in-out 0.6s infinite;
    }

    .sparkle-glint-dot {
      animation: starFloatGlint 4.1s ease-in-out 1.7s infinite;
    }

    .folder-glow-card:hover .sparkle-star-lg,
    .folder-glow-card:hover .sparkle-star-md,
    .folder-glow-card:hover .sparkle-star-sm {
      animation-duration: 1.9s;
    }
  </style>
</head>

    function getDefaultCourses() {
      return [

          description: 'Buchführung, Bestandskonten, Umsatzsteuer, Bilanzierung & Abschreibungen',
          cards: [
            // TO DO
            {
              id: 'rw-1',
              column: 'todo',
              priority: 'High',
              category: 'Bilanz',
              title: 'Jahresabschluss & Abschreibungen (AfA)',
              lessonsCount: 18,
              notesCount: 2,
              duration: '5 days',

              avatars: [0, 1],
              summary: 'Planmäßige lineare Abschreibung (AfA) von abnutzbarem Anlagevermögen, Anschaffungskosten berechnen und zeitanteilige AfA verbuchen.',

        if (parsed.courses && Array.isArray(parsed.courses) && parsed.courses.length === 3) {

    /**
     * Renders the exact 16-tick segmented vertical bar progress indicator from the screenshot:
     * 16 vertical bars (2.5px wide x 11px tall, 2.5px gap), cobalt blue (#3B82F6) for completed ratio
     * and dark charcoal (#323237) for remaining steps.
     */
    function renderSegmentedTicks(completedSteps, totalSteps) {
      const totalTicks = 16;
      const ratio = totalSteps > 0 ? Math.min(1, Math.max(0, completedSteps / totalSteps)) : 0;
      const activeTicks = Math.round(ratio * totalTicks);
      let ticksHtml = '<div class="tick-bar-container" aria-hidden="true">';
      for (let i = 0; i < totalTicks; i++) {
        const isFilled = i < activeTicks;
        ticksHtml += `<span class="tick-segment" style="background-color: ${isFilled ? '#3B82F6' : '#323237'};"></span>`;
      }
      ticksHtml += '</div>';
      return ticksHtml;
    }

    function renderKanbanBoard(course) {
      const columns = [
        { id: 'todo', title: 'To Do', barColor: '#7E7E87' },
        { id: 'inprogress', title: 'In Progress', barColor: '#3B82F6' },
        { id: 'completed', title: 'Done', barColor: '#10B981' }
      ];

      return `
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 items-start min-w-0">
          ${columns.map(col => {
            const colCards = course.cards.filter(c => c.column === col.id);
            return `
              <section
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event, '${col.id}')"
                class="kanban-column flex flex-col min-w-0 p-1 transition-colors"
              >
                <!-- Column Header -->
                <div class="flex items-center justify-between px-1 mb-3.5">
                  <div class="flex items-center gap-2.5">
                    <span class="w-[2.5px] h-[14px] rounded-full" style="background-color: ${col.barColor};"></span>
                    <h2 class="text-[14.5px] font-medium text-[#E4E4E7]">${col.title}</h2>
                    <span class="text-[12px] text-[#6E6E77] font-medium">${colCards.length}</span>
                  </div>
                  <button onclick="openAddCardModal('${col.id}')" title="Modul hinzufügen" class="p-1 rounded-md text-[#78787F] hover:text-[#E4E4E7] hover:bg-[#1E1E22] transition">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                      <circle cx="12" cy="5" r="1.7" />
                      <circle cx="12" cy="12" r="1.7" />
                      <circle cx="12" cy="19" r="1.7" />
                    </svg>
                  </button>
                </div>

                <!-- Column Cards Stack -->
                <div class="space-y-3.5">
                  ${colCards.map(card => renderKanbanCard(card)).join('')}
                </div>

                <!-- "+ Add New" Footer Action (1:1 match to screenshot) -->
                <button onclick="openAddCardModal('${col.id}')"
                        class="mt-4 inline-flex items-center gap-2 px-1.5 py-2 text-[13.5px] font-medium text-[#9A9AA0] hover:text-[#F4F4F6] transition w-fit focus:outline-none">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  <span>Add New</span>
                </button>
              </section>

          }).join('')}

    function renderListView(course) {
      return `
        <div class="space-y-2.5 max-w-4xl">
          ${course.cards.map(card => `
            <div onclick="openModuleDrawer('${card.id}')"
                 class="flex items-center justify-between gap-4 bg-[#1A1A1D] hover:bg-[#1E1E22] border border-[#26262A] rounded-[11px] px-4 py-3.5 cursor-pointer transition">
              <div class="flex items-center gap-3 min-w-0">
                ${renderPriorityBadge(card.priority)}
                ${renderCategoryBadge(card.category)}
                <span class="text-[14px] font-semibold text-[#F4F4F6] truncate">${escapeHtml(card.title)}</span>
              </div>
              <div class="flex items-center gap-4 shrink-0">
                <span class="hidden sm:inline text-[12px] text-[#8E8E93]">${escapeHtml(card.duration)}</span>
                ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
                <span class="text-[12px] font-semibold text-[#E4E4E7] w-12 text-right">${card.completedSteps}/${card.totalSteps}</span>
              </div>

          `).join('')}
          <button onclick="openAddCardModal('todo')" class="mt-3 inline-flex items-center gap-2 px-2 py-2 text-[13.5px] font-medium text-[#9A9AA0] hover:text-[#F4F4F6]">
            <span>+ Add New</span>

    function renderTimelineView(course) {
      return `
        <div class="space-y-3.5 max-w-4xl">
          ${course.cards.map(card => {
            const pct = card.totalSteps > 0 ? Math.round((card.completedSteps / card.totalSteps) * 100) : 0;
            return `
              <div onclick="openModuleDrawer('${card.id}')"
                   class="bg-[#1A1A1D] hover:bg-[#1E1E22] border border-[#26262A] rounded-[12px] p-4 cursor-pointer transition">

    function renderTableView(course) {
      const statusLabels = { todo: 'To Do', inprogress: 'In Progress', completed: 'Done' };
      return `
        <div class="overflow-x-auto bg-[#161618] border border-[#242428] rounded-[12px]">

                    </div>

    function renderDashboardView() {
      const totalDone = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.completedSteps, 0), 0);
      const totalAll = COURSES.reduce((sum, c) => sum + c.cards.reduce((s, m) => s + m.totalSteps, 0), 0);
      const overallPct = totalAll > 0 ? Math.round((totalDone / totalAll) * 100) : 0;
      const dailyPct = appState.dailyGoal > 0 ? Math.min(100, Math.round((appState.completedToday / appState.dailyGoal) * 100)) : 0;

      const todoCards = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column === 'todo').length, 0);
      const inProgCards = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column === 'inprogress').length, 0);
      const doneCards = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column === 'completed').length, 0);

      const sortedExams = [...appState.exams].sort((a, b) => a.date.localeCompare(b.date));
      const nextExam = sortedExams[0] || null;
      const upcomingExams = sortedExams.slice(0, 3);

      const inProgressModules = COURSES.flatMap(c =>
        c.cards
          .filter(m => m.column === 'inprogress')
          .map(m => ({ ...m, courseId: c.id, courseTitle: c.title }))
      );
      const spotlightModule = inProgressModules[0] || null;
      const masteredFlashcards = appState.flashcards.filter(f => f.mastered).length;
      const openFlashcards = appState.flashcards.length - masteredFlashcards;

      // SVG Donut Ring Geometry (r = 34 -> circumference = 213.6)
      const ringRadius = 34;
      const ringCirc = 2 * Math.PI * ringRadius;
      const ringOffset = ringCirc - (overallPct / 100) * ringCirc;

      // Weekly rhythm bars (Mon-Sun)
      const weekActivity = [
        { day: 'Mo', units: 0, active: false },
        { day: 'Di', units: 0, active: false },
        { day: 'Mi', units: 0, active: false },
        { day: 'Do', units: 0, active: false },
        { day: 'Fr', units: 0, active: false },
        { day: 'Sa', units: 0, active: false },
        { day: 'So', units: Math.min(9, appState.completedToday), active: appState.completedToday > 0, isToday: true }
      ];

      const getDaysCountdown = (isoDate) => {
        if (!isoDate) return '';
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(isoDate + 'T00:00:00');
        const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return 'Vorbei';
        if (diffDays === 0) return 'Heute';
        if (diffDays === 1) return 'Morgen';
        return `in ${diffDays} Tagen`;
      };

      // Distinct domain-specific icons (different from the Project folder icons)
      const subjectMeta = {
        rechnungswesen: {
          color: '#5294FF',
          bgSoft: 'rgba(82, 148, 255, 0.12)',
          borderSoft: 'rgba(82, 148, 255, 0.25)',
          tag: 'BWL & Buchhaltung',
          icon: `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5294FF" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="2.5" />
              <line x1="8" y1="6" x2="16" y2="6" />
              <line x1="8" y1="11" x2="10" y2="11" />
              <line x1="14" y1="11" x2="16" y2="11" />
              <line x1="8" y1="15" x2="10" y2="15" />
              <line x1="14" y1="15" x2="16" y2="15" />
              <line x1="8" y1="19" x2="16" y2="19" />
            </svg>
          `
        },
        gespraechsgestaltung: {
          color: '#E88D56',
          bgSoft: 'rgba(232, 141, 86, 0.12)',
          borderSoft: 'rgba(232, 141, 86, 0.25)',
          tag: 'Kommunikation',
          icon: `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E88D56" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          `
        },
        sozialkunde: {
          color: '#9D75FA',
          bgSoft: 'rgba(157, 117, 250, 0.12)',
          borderSoft: 'rgba(157, 117, 250, 0.25)',
          tag: 'Recht & Wirtschaft',
          icon: `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9D75FA" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="21" x2="21" y2="21" />
              <line x1="6" y1="10" x2="6" y2="18" />
              <line x1="10" y1="10" x2="10" y2="18" />
              <line x1="14" y1="10" x2="14" y2="18" />
              <line x1="18" y1="10" x2="18" y2="18" />
              <polygon points="12 3 2 8 22 8 12 3" />
            </svg>
          `
        }
      };

      // Segmented pill meter for daily goal (up to 10 segments)
      const totalGoalPills = Math.min(12, Math.max(4, appState.dailyGoal));
      const filledGoalPills = Math.round((dailyPct / 100) * totalGoalPills);

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7">
          <div class="max-w-[1140px]">

            <!-- Top Command Bar with Weekly Activity Visualizer -->
            <div class="bg-[#161618] border border-[#242429] rounded-[16px] p-5 sm:p-6 mb-6 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
              <div>
                <div class="flex items-center gap-2.5 mb-2">
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#3B82F6]/12 border border-[#3B82F6]/25 text-[11.5px] font-medium text-[#60A5FA]">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                    </svg>
                    ${appState.completedToday > 0 ? 'Aktiv heute' : 'Lernstart bereit'}
                  </span>
                  <span class="text-[12px] text-[#7E7E87]">Dienstag, 17. Nov</span>
                </div>
                <h1 class="text-[24px] sm:text-[28px] font-bold text-[#F4F4F6] tracking-[-0.025em] leading-tight">
                  Guten Abend, ${escapeHtml(appState.userName)}
                </h1>
                <p class="text-[13.5px] text-[#8E8E93] mt-1">
                  Bereit für deine nächste Lerneinheit in Rechnungswesen, Gesprächsgestaltung oder Sozialkunde?

              </div>

              <!-- Right: Compact 7-Day Rhythm Bars + Quick Buttons -->

                  <div class="flex items-center justify-between gap-4 mb-2">
                    <span class="text-[11px] font-medium uppercase tracking-wider text-[#7E7E87]">Wochenaktivität</span>

                    + Klausur eintragen

                  <button onclick="navigateSection('inbox')"

                    Karteikarten (${openFlashcards} offen)
                  </button>
                </div>
              </div>
            </div>

            <!-- Bento Row 1: 3 Distinct Architectural Widgets (Donut Ring + Stepper + Exam Ticket) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 mb-7">

              <!-- Widget A (5 cols): SVG Donut Progress Ring & Module Distribution -->
              <div onclick="openSubjectsOverview()"
                   class="lg:col-span-5 bg-[#161618] hover:bg-[#19191C] border border-[#242429] hover:border-[#32323A] rounded-[16px] p-5 cursor-pointer transition flex items-center justify-between gap-5">
                <div class="flex items-center gap-4">
                  <div class="relative w-[84px] h-[84px] shrink-0 flex items-center justify-center">
                    <svg class="w-full h-full -rotate-90" viewBox="0 0 84 84">
                      <circle cx="42" cy="42" r="${ringRadius}" fill="none" stroke="#222227" stroke-width="7" />
                      <circle cx="42" cy="42" r="${ringRadius}" fill="none" stroke="#3B82F6" stroke-width="7"
                              stroke-linecap="round"
                              stroke-dasharray="${ringCirc.toFixed(1)}"
                              stroke-dashoffset="${ringOffset.toFixed(1)}"
                              class="transition-all duration-500" />
                    </svg>
                    <span class="absolute text-[17px] font-bold text-[#F4F4F6]">${overallPct}%</span>
                  </div>
                  <div>
                    <div class="text-[12px] font-medium text-[#8E8E93] mb-0.5">Gesamtfortschritt</div>
                    <div class="text-[19px] font-bold text-[#F4F4F6] tracking-[-0.015em]">${totalDone} / ${totalAll}</div>
                    <div class="text-[12px] text-[#60A5FA] mt-1">Lektionen abgeschlossen</div>
                  </div>

              <div class="grid grid-cols-7 gap-1.5">
                ${Array.from({ length: startOffset }).map(() => `<div class="min-h-[76px] rounded-[8px] bg-[#131315]/50"></div>`).join('')}
                ${Array.from({ length: daysInMonth }, (_, i) => {
                  const dayNum = i + 1;
                  const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                  const isToday = iso === '2026-11-17';
                  const dayExams = sortedExams.filter(e => e.date === iso);

                  return `
                    <div onclick="openAddExamModal('${iso}')"
                         class="min-h-[76px] rounded-[8px] p-1.5 border cursor-pointer transition ${isToday ? 'bg-[#1D2330] border-[#3B82F6]' : 'bg-[#1A1A1D] hover:bg-[#1F1F23] border-[#252529]'}">
                      <div class="flex items-center justify-between">
                        <span class="text-[11.5px] font-medium ${isToday ? 'text-[#60A5FA]' : 'text-[#9A9AA0]'}">${dayNum}</span>
                      </div>
                      <div class="mt-1 space-y-1">
                        ${dayExams.map(ex => `
                          <div onclick="event.stopPropagation(); openExamDetailModal('${ex.id}')"
                               class="px-1.5 py-0.5 rounded text-[10px] font-medium truncate ${ex.type === 'Klassenarbeit' ? 'bg-[#EF4444]/20 border border-[#EF4444]/35 text-[#FCA5A5]' : 'bg-[#3B82F6]/20 border border-[#3B82F6]/35 text-[#93C5FD]'}">

                      </div>
                    </div>

                }).join('')}
              </div>
            </div>

            <!-- Upcoming Exams & "Was kommt dran?" List (5 cols) -->
            <div class="xl:col-span-5 space-y-3.5">
              <h2 class="text-[15px] font-semibold text-[#F4F4F6]">Anstehende Klassenarbeiten &amp; Tests (${sortedExams.length})</h2>
              ${sortedExams.length === 0 ? `
                <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-6 text-center text-[13px] text-[#8E8E93]">
                  Noch keine Termine eingetragen. Klicke auf „+ Termin eintragen“.
                </div>
              ` : sortedExams.map(ex => `
                <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-4">
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-2">
                      ${renderCategoryBadge(ex.subject)}
                      <span class="text-[11px] font-medium px-2 py-0.5 rounded bg-[#252529] text-[#D4D4D8]">${escapeHtml(ex.type)}</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-[12px] font-semibold text-[#E59A3C]">${formatGermanDate(ex.date)}</span>
                      <button onclick="deleteExam('${ex.id}')" title="Termin löschen" class="text-[#78787F] hover:text-[#F87171] text-[12px] px-1">✕</button>
                    </div>
                  </div>
                  <h3 class="text-[14.5px] font-semibold text-[#F4F4F6] mb-2">${escapeHtml(ex.title)}</h3>
                  <div class="bg-[#131315] border border-[#242429] rounded-[8px] p-3">
                    <div class="text-[11px] font-semibold uppercase tracking-wider text-[#60A5FA] mb-1">Was kommt dran?</div>
                    <p class="text-[12.5px] text-[#C4C4CC] leading-relaxed whitespace-pre-line">${escapeHtml(ex.topics)}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderReportsView() {
      const totalCards = COURSES.reduce((s, c) => s + c.cards.length, 0);
      const todoCount = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column === 'todo').length, 0);
      const progCount = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column === 'inprogress').length, 0);
      const doneCount = COURSES.reduce((s, c) => s + c.cards.filter(m => m.column === 'completed').length, 0);

      return `
        <div class="flex-1 overflow-y-auto px-6 sm:px-9 py-7 max-w-4xl">
          <h1 class="text-[26px] font-bold text-[#F4F4F6] tracking-[-0.02em] mb-1">Lernfortschritt &amp; Reports</h1>
          <p class="text-[13.5px] text-[#8E8E93] mb-6">Auswertung über Rechnungswesen, Gesprächsgestaltung und Sozialkunde</p>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-4">
              <div class="text-[12px] text-[#8E8E93]">To Do Module</div>
              <div class="text-[22px] font-bold text-[#F4F4F6] mt-1">${todoCount} <span class="text-[13px] font-normal text-[#78787F]">von ${totalCards}</span></div>
            </div>
            <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-4">
              <div class="text-[12px] text-[#60A5FA]">In Progress</div>
              <div class="text-[22px] font-bold text-[#F4F4F6] mt-1">${progCount} <span class="text-[13px] font-normal text-[#78787F]">von ${totalCards}</span></div>
            </div>
            <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-4">
              <div class="text-[12px] text-[#34D399]">Abgeschlossen (Done)</div>
              <div class="text-[22px] font-bold text-[#F4F4F6] mt-1">${doneCount} <span class="text-[13px] font-normal text-[#78787F]">von ${totalCards}</span></div>
            </div>
          </div>

          <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-5 space-y-5">
            ${COURSES.map(c => {
              const done = c.cards.reduce((s, m) => s + m.completedSteps, 0);
              const total = c.cards.reduce((s, m) => s + m.totalSteps, 0);
              const pct = total > 0 ? Math.round((done / total) * 100) : 0;
              return `
                <div>
                  <div class="flex items-center justify-between text-[13.5px] mb-2">
                    <span class="font-semibold text-[#F4F4F6]">${escapeHtml(c.title)}</span>
                    <span class="text-[#9A9AA0]">${done} / ${total} Lektionen (${pct}%)</span>
                  </div>
                  <div class="w-full h-2.5 bg-[#111113] rounded-full overflow-hidden border border-[#242428]">
                <div class="h-full bg-[#3B82F6] rounded-full transition-all" style="width: ${pct}%;"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

    function openModuleDrawer(cardId) {
      appState.selectedCardId = cardId;
      const overlay = document.getElementById('module-drawer-overlay');
      if (overlay) overlay.classList.remove('hidden');
      renderModuleDrawerContent();
    }

    function closeModuleDrawer() {
      appState.selectedCardId = null;
      const overlay = document.getElementById('module-drawer-overlay');
      if (overlay) overlay.classList.add('hidden');
    }

    function renderModuleDrawerContent() {
      const card = getCardById(appState.selectedCardId);
      if (!card) return;

      const selectedQuizIdx = appState.quizAnswers[card.id];
      const hasAnsweredQuiz = selectedQuizIdx !== undefined;
      const isQuizCorrect = selectedQuizIdx === card.quiz.correctIndex;

      const container = document.getElementById('module-drawer-content');
      if (!container) return;
      container.innerHTML = `
        <!-- Drawer Top Bar -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-[#242428] shrink-0">
          <div class="flex items-center gap-2">
            ${renderPriorityBadge(card.priority)}
            ${renderCategoryBadge(card.category)}
          </div>
          <div class="flex items-center gap-2">
            <select onchange="moveCardColumn('${card.id}', this.value)"
                    class="bg-[#222226] border border-[#323238] rounded-[7px] px-2.5 py-1 text-[12px] text-[#E4E4E7] focus:outline-none">
              <option value="todo" ${card.column === 'todo' ? 'selected' : ''}>To Do</option>
              <option value="inprogress" ${card.column === 'inprogress' ? 'selected' : ''}>In Progress</option>
              <option value="completed" ${card.column === 'completed' ? 'selected' : ''}>Done</option>
            </select>
            <button onclick="closeModuleDrawer()" class="p-1.5 rounded-lg text-[#8E8E93] hover:text-white hover:bg-[#242428] transition">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Drawer Scrollable Body -->
        <div class="flex-1 overflow-y-auto px-6 py-5 space-y-6">
          <!-- Title & Live Progress -->
          <div>
            <h2 class="text-[20px] font-bold text-[#F4F4F6] tracking-[-0.015em] mb-2">${escapeHtml(card.title)}</h2>
            <p class="text-[13.5px] text-[#9A9AA0] leading-relaxed mb-4">${escapeHtml(card.summary)}</p>

            <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[10px] p-3.5 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                ${renderSegmentedTicks(card.completedSteps, card.totalSteps)}
                <span class="text-[13px] font-semibold text-[#F4F4F6]">${card.completedSteps} / ${card.totalSteps} Lektionen</span>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="adjustSteps('${card.id}', -1)" class="w-7 h-7 rounded bg-[#242428] hover:bg-[#2F2F35] text-[#E4E4E7] text-[14px] font-medium">−</button>
                <button onclick="adjustSteps('${card.id}', 1)" class="w-7 h-7 rounded bg-[#3B82F6] hover:bg-[#2563EB] text-white text-[14px] font-medium">+</button>
              </div>
            </div>
          </div>

          <!-- Lernstoff / Theorie -->
          <div class="space-y-3">
            <h3 class="text-[13.5px] font-semibold uppercase tracking-wider text-[#8E8E93]">Kompaktwissen &amp; Theorie</h3>
            ${card.theory.map(t => `
              <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[10px] p-4">
                <h4 class="text-[14px] font-semibold text-[#F4F4F6] mb-1">${escapeHtml(t.heading)}</h4>
                <p class="text-[13px] text-[#9A9AA0] leading-relaxed">${escapeHtml(t.body)}</p>
              </div>
            `).join('')}
            ${card.codeExample ? `
              <pre class="bg-[#111113] border border-[#26262A] rounded-[10px] p-3.5 text-[12px] text-[#93C5FD] overflow-x-auto font-mono leading-relaxed"><code>${escapeHtml(card.codeExample)}</code></pre>
            ` : ''}
          </div>

          <!-- Interaktive Lektions-Checkliste -->
          <div>
            <h3 class="text-[13.5px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-3">Lernziele &amp; Checkliste</h3>
            <div class="space-y-2">
              ${card.checklist.map((item, idx) => `
                <label onclick="toggleChecklistItem('${card.id}', ${idx})"
                       class="flex items-center gap-3 p-3 rounded-[9px] bg-[#1A1A1D] border border-[#26262A] hover:border-[#34343B] cursor-pointer transition">
                  <span class="w-4 h-4 rounded flex items-center justify-center border ${item.done ? 'bg-[#3B82F6] border-[#3B82F6] text-white' : 'border-[#484852] bg-[#111113]'}">
                    ${item.done ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                  </span>
                  <span class="text-[13px] ${item.done ? 'line-through text-[#78787F]' : 'text-[#E4E4E7]'}">${escapeHtml(item.text)}</span>
                </label>
              `).join('')}
            </div>
          </div>

          <!-- Interaktiver Wissens-Check (Quiz) -->
          <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[12px] p-4">
            <div class="flex items-center gap-2 mb-2">
              <span class="px-2 py-0.5 rounded bg-[#3B82F6]/20 text-[#60A5FA] text-[11px] font-semibold">WISSENS-CHECK</span>
            </div>
            <p class="text-[13.5px] font-medium text-[#F4F4F6] mb-3">${escapeHtml(card.quiz.question)}</p>
            <div class="space-y-2">
              ${card.quiz.options.map((opt, idx) => {
                let btnStyle = 'bg-[#141416] border-[#28282E] text-[#D4D4D8] hover:border-[#3E3E46]';
                if (hasAnsweredQuiz) {
                  if (idx === card.quiz.correctIndex) {
                    btnStyle = 'bg-[#10B981]/15 border-[#10B981]/40 text-[#6EE7B7]';
                  } else if (idx === selectedQuizIdx) {
                    btnStyle = 'bg-[#EF4444]/15 border-[#EF4444]/40 text-[#FCA5A5]';
                  }
                }
                return `
                  <button onclick="answerQuiz('${card.id}', ${idx})"
                          class="w-full text-left px-3.5 py-2.5 rounded-[8px] border text-[13px] transition ${btnStyle}">
                    ${escapeHtml(opt)}
                  </button>
                `;
              }).join('')}
            </div>
            ${hasAnsweredQuiz ? `
              <div class="mt-3 text-[12.5px] leading-relaxed p-3 rounded-[8px] ${isQuizCorrect ? 'bg-[#10B981]/10 text-[#6EE7B7]' : 'bg-[#F59E0B]/10 text-[#FCD34D]'}">
                ${escapeHtml(card.quiz.explanation)}
              </div>
            ` : ''}
          </div>

          <!-- Lernnotizen -->
          <div>
            <h3 class="text-[13.5px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-3">Lernnotizen (${card.notes.length})</h3>
            <div class="space-y-2.5 mb-3">
              ${card.notes.map(note => `
                <div class="bg-[#1A1A1D] border border-[#26262A] rounded-[9px] p-3">
                  <div class="flex items-center justify-between text-[11.5px] text-[#78787F] mb-1">
                    <span class="font-medium text-[#D4D4D8]">${escapeHtml(note.author)}</span>
                    <span>${escapeHtml(note.time)}</span>
                  </div>
                  <p class="text-[13px] text-[#A1A1AA]">${escapeHtml(note.text)}</p>
                </div>
              `).join('')}
            </div>
            <form onsubmit="addModuleNote(event, '${card.id}')" class="flex gap-2">
              <input id="new-note-input" type="text" placeholder="Eigene Lernnotiz hinzufügen..."
                     class="flex-1 bg-[#111113] border border-[#2A2A30] rounded-[8px] px-3 py-2 text-[13px] text-[#F4F4F6] placeholder-[#686870] focus:outline-none focus:border-[#3B82F6]" />
              <button type="submit" class="px-3.5 py-2 rounded-[8px] bg-[#252529] hover:bg-[#303036] border border-[#35353C] text-[13px] font-medium text-[#F4F4F6] transition">
                Speichern
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function renderSearchResults(query) {
      const q = query.trim().toLowerCase();
      const allCards = COURSES.flatMap(course => course.cards.map(card => ({ ...card, courseTitle: course.title, courseId: course.id })));
      const matches = q
        ? allCards.filter(c => c.title.toLowerCase().includes(q) || c.category.toLowerCase().includes(q) || c.courseTitle.toLowerCase().includes(q))
        : allCards;

      if (matches.length === 0) {
        return `<div class="py-8 text-center text-[13px] text-[#78787F]">Keine passenden Lernmodule gefunden.</div>`;
      }

      return matches.map(m => `
        <button onclick="selectSearchResult('${m.courseId}', '${m.id}')"
                class="w-full text-left p-2.5 rounded-[8px] hover:bg-[#222227] flex items-center justify-between gap-3 transition">
          <div>
            <div class="text-[13.5px] font-medium text-[#F4F4F6]">${escapeHtml(m.title)}</div>
            <div class="text-[11.5px] text-[#78787F]">${escapeHtml(m.courseTitle)} • ${escapeHtml(m.category)}</div>
          </div>
          <span class="text-[12px] text-[#60A5FA] font-medium">${m.completedSteps}/${m.totalSteps}</span>
        </button>
      `).join('');
    }

    function filterSearchResults(val) {
      const list = document.getElementById('search-results-list');
      if (list) list.innerHTML = renderSearchResults(val);
    }

    function handleFolderCardMove(event, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -3.5;
      const rotateY = ((x - centerX) / centerX) * 3.5;

      cardEl.style.setProperty('--mouse-x', `${x}px`);
      cardEl.style.setProperty('--mouse-y', `${y}px`);
      cardEl.style.setProperty('--tilt-x', `${rotateX.toFixed(2)}deg`);
      cardEl.style.setProperty('--tilt-y', `${rotateY.toFixed(2)}deg`);
    }

    function handleFolderCardLeave(cardEl) {
      cardEl.style.setProperty('--tilt-x', '0deg');
      cardEl.style.setProperty('--tilt-y', '0deg');
    }

    function toggleMobileSidebar(open) {
      const sidebar = document.getElementById('left-sidebar');

        sidebar.classList.remove('-translate-x-full');

    // Drag & Drop handlers
    function handleDragStart(event, cardId) {
      appState.draggedCardId = cardId;
      event.currentTarget.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(event) {
      event.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.kanban-column').forEach(col => col.classList.remove('drag-over'));
    }

    function handleDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(event) {
      event.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(event, targetColumn) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      if (!appState.draggedCardId) return;
      moveCardColumn(appState.draggedCardId, targetColumn);
      appState.draggedCardId = null;
    }

    function moveCardColumn(cardId, targetColumn) {
      const card = getCardById(cardId);
      if (!card) return;
      card.column = targetColumn;
      if (targetColumn === 'completed') {
        card.completedSteps = card.totalSteps;
      }
      savePersistedState();
      renderWorkspace();
      if (appState.selectedCardId === cardId) {
        renderModuleDrawerContent();
      }
      showToast(`Modul nach „${targetColumn === 'todo' ? 'To Do' : targetColumn === 'inprogress' ? 'In Progress' : 'Done'}“ verschoben`);
    }

    function adjustSteps(cardId, delta) {
      const card = getCardById(cardId);
      if (!card) return;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + delta));
      if (delta > 0) appState.completedToday += 1;
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function toggleChecklistItem(cardId, itemIdx) {
      const card = getCardById(cardId);
      if (!card || !card.checklist[itemIdx]) return;
      const item = card.checklist[itemIdx];
      item.done = !item.done;
      card.completedSteps = Math.max(0, Math.min(card.totalSteps, card.completedSteps + (item.done ? 1 : -1)));
      savePersistedState();
      renderWorkspace();
      renderModuleDrawerContent();
    }

    function submitNewCard(event, columnId) {

        ],
        quiz: {
          question: `Hast du die wichtigsten Inhalte zu „${title}“ bereits wiederholt?`,
          options: ['Ja, Thema sitzt', 'Noch in Bearbeitung'],
          correctIndex: 0,
          explanation: 'Super! Regelmäßiges Wiederholen festigt das Wissen für die Klassenarbeit.'

    function handleProfileImageUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Bitte wähle eine gültige Bilddatei aus');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const size = 200;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          appState.profileImage = canvas.toDataURL('image/jpeg', 0.85);
          savePersistedState();
          updateSidebarAvatar();
          renderWorkspace();
          showToast('Profilbild aktualisiert');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeProfileImage() {
      appState.profileImage = null;
      savePersistedState();
      updateSidebarAvatar();
      renderWorkspace();
      showToast('Profilbild entfernt');
    }

        localStorage.removeItem(STORAGE_KEY);

      COURSES = getDefaultCourses();
      appState.exams = getDefaultExams();
      appState.flashcards = getDefaultFlashcards();
      appState.quickNotes = [];

      appState.profileImage = null;
      appState.dailyGoal = 6;

      appState.activeCourseId = 'rechnungswesen';

      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.add('hidden');
      renderWorkspace();
      showToast('Alle Lernprojekte & Termine zurückgesetzt');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'bg-[#202024] border border-[#34343B] text-[#F4F4F6] text-[12.5px] font-medium px-3.5 py-2.5 rounded-[9px] shadow-xl animate-scale-in';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    function formatGermanDate(isoStr) {
      if (!isoStr || !isoStr.includes('-')) return isoStr || '';
      const [y, m, d] = isoStr.split('-');
      return `${d}.${m}.${y}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Keyboard shortcuts (Cmd/Ctrl+K for Search, Escape to close overlays)
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
      } else if (e.key === 'Escape') {
        closeModal();
        closeModuleDrawer();
      }
    });

    // Initial load & render
    window.addEventListener('DOMContentLoaded', () => {
      loadPersistedState();
      updateSidebarAvatar();
      syncNavHighlight(appState.activeNav);
      const hasUnread = appState.notifications.some(n => n.unread);
      const badge = document.getElementById('notif-badge');
      if (badge) badge.classList.toggle('hidden', !hasUnread);
      renderWorkspace();
    });
  </script>
</body>
</html>
